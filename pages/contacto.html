<main>

    <section>
        <h1 class="titulos">Contactanos</h1>
        <p class="parrafos">Dejanos tu consulta y nos comunicaremos con vos.</p>

        <figure>
            <img src="../assets/contacto.png" alt="Personal respondiendo consultas">
            <figcaption>Nuestro personal se comunicará para asesorarte.</figcaption>
        </figure>
        

        <form action="#" method="get">

            <div>
            <label for="nombre"> Nombre:</label>
            <input id="nombre" name="nombre" required>
            </div>


            <div>
            <label for="email"> Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
            </div>


            <div>
            <label for="telefono"> Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">
            </div>


            <div>
            <label for="mensaje"> Tu mensaje:</label>
            <textarea name="mensaje" id="mensaje" required></textarea>
            <input type="submit" value="Enviar">
            </div>

        </form>
    </section>


</main>
